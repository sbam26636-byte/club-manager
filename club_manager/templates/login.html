{% extends "base.html" %}
{% from "_macros.html" import csrf with context %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5 col-xl-4">
    <h1 class="h3 mb-1">Log in</h1>
    <p class="text-secondary">Use the email and temporary password your club admin gave you.</p>
    <form method="post" class="panel">
      {{ csrf() }}
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ request.form.get('email', '') }}" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
